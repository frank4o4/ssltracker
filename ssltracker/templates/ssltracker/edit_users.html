
{% extends 'ssltracker/base.html' %}

{% block content %}
  <h2>Edit Users</h2>
  
  <form method="post" action="{% url 'edit_users' user.id %}">
    {% csrf_token %}
  
  <table border="0" cellpadding="5" cellspacing="0">
    {{ form.as_table }}
    <tr>
        <td>&nbsp;</td>
        <td><button type="submit" class="btn btn-primary">Save</button></td>
    </tr>
</table>
</form>

{% endblock %}
